plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googleauth'
version = '1.0.0'

android {
  namespace "expo.modules.googleauth"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-auth:22.0.0' // Identity AuthorizationClient
}
