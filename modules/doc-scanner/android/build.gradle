plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.docscanner'
version = '1.0.0'

android {
  namespace "expo.modules.docscanner"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  def camerax = "1.6.0"
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  implementation "org.opencv:opencv:4.12.0" // edge detection, perspective warp, filters
  implementation "com.google.zxing:core:3.5.3" // QR codes seen while scanning (~0.5 MB, no ML model)
}
